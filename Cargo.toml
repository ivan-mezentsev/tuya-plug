[package]
name = "tuya-plug"
version = "0.1.0"
edition = "2021"
description = "Minimal Tuya 3.3 LAN control: status/on/off for one WiFi plug, zero runtime deps (static musl)"

[[bin]]
name = "tuya-plug"
path = "src/main.rs"

[profile.release]
strip = true

[dependencies]
aes = "0.8"
ecb = "0.1"
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
